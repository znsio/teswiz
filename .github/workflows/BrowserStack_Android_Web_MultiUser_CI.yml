name: BrowserStack_Android_Web_MultiUser_CI

on:
  push:
    branches: [main, pw-ts]
  pull_request:
    branches: [main]

env:
  APPLITOOLS_BATCH_NAME_SUFFIX: " - #${{ github.run_number }}"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Install Appium dependencies
        run: |
          node -v
          npm ci
          npm list

      - name: Run vodQA Multi-User Android-Web tests
        id: vodqa_multi_user_android_web
        uses: ./.github/actions/run-and-collect-tests
        with:
          id: vodqa-multi-user-android-web
          display-name: "vodQA Multi-User Android-Web"
          config-path: "./configs/vodqa/vodqa_browserstack_config.properties"
          platform: "android"
          tag: "@multiuser-android-web and @vodqa1 and @browserstack"
          artifact-name: "test-results-vodqa-multi-user-android-web"
          is-visual: "true"
          additional-env: "APPLITOOLS_BATCH_NAME_SUFFIX=' - #${{ github.run_number }}'"
          applitools_api_key: ${{ secrets.TESWIZ_APPLITOOLS_API_KEY }}
          browserstack_username: ${{ secrets.BROWSERSTACK_CLOUD_USERNAME }}
          browserstack_key: ${{ secrets.BROWSERSTACK_CLOUD_KEY }}

      - name: Check for Failures and Add Summary
        run: |
          echo "Checking exit code for BrowserStack Android-Web multi-user test run..."
          VODQA_MULTI_USER_ANDROID_WEB_CODE="${{ steps.vodqa_multi_user_android_web.outputs.exit_code }}"

          if [ "$VODQA_MULTI_USER_ANDROID_WEB_CODE" != "0" ]; then
            {
              echo "### ❌ BrowserStack Android-Web Multi-User CI Test Failure"
              echo "- vodQA Multi-User Android-Web (exit code: $VODQA_MULTI_USER_ANDROID_WEB_CODE)"
              echo
              echo "**Commit:** ${{ github.sha }}"
              echo "**Triggered by:** ${{ github.actor }}"
              echo "**Workflow:** [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ BrowserStack Android-Web multi-user suite passed"

      - name: Keep latest BrowserStack Android-Web multi-user artifacts for this branch
        if: always()
        uses: ./.github/actions/cleanup-branch-artifacts
        with:
          workflow-file: BrowserStack_Android_Web_MultiUser_CI.yml
          branch-name: ${{ github.head_ref || github.ref_name }}
          current-run-id: ${{ github.run_id }}
