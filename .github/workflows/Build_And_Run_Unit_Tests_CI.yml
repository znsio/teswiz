name: Build_And_Run_Unit_Tests

on:
  push:
    branches: [main, pw-ts]
  pull_request:
    branches: [main]

env:
  APPLITOOLS_BATCH_NAME_SUFFIX: " - #${{ github.run_number }}"

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: 🐛 Debug TESWIZ_REPO_DISPATCH_TOKEN (first/last 15 chars)
        run: |
          echo "First 15: ${TOKEN:0:15}"
          echo "Last 15: ${TOKEN: -15}"
          echo "Starts with: ${TOKEN:0:4}"
        env:
          TOKEN: ${{ secrets.TESWIZ_REPO_DISPATCH_TOKEN }}

      - name: 🐛 Debug TESWIZ_PAT (first/last 15 chars)
        run: |
          echo "First 15: ${TOKEN:0:15}"
          echo "Last 15: ${TOKEN: -15}"
          echo "Starts with: ${TOKEN:0:4}"
        env:
          TOKEN: ${{ secrets.TESWIZ_PAT }}

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🎭 Install Playwright Chromium
        run: npx playwright install chromium

      - name: 🧪 Build with Gradle and Run Unit Tests
        uses: gradle/gradle-build-action@v3
        env:
          TESWIZ_APPLITOOLS_API_KEY: ${{ secrets.TESWIZ_APPLITOOLS_API_KEY }}
        with:
          arguments: clean build --refresh-dependencies

      - name: 🆔 Capture Commit ID
        run: echo "COMMIT_ID=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: 📝 Update README with Commit ID (main only)
        if: github.ref_name == 'main'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git pull --rebase origin main

          awk -v id="$COMMIT_ID" '{gsub("commit-.*-blue", "commit-"id"-blue")}1' README.md > README_temp.md
          mv README_temp.md README.md

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Updating README with commit ID: $COMMIT_ID"
            git add README.md
            git commit -m "🔄 Update README with latest commit ID - $COMMIT_ID"
            git push origin main
          else
            echo "✅ No changes to commit"
          fi
        env:
          COMMIT_ID: ${{ env.COMMIT_ID }}
          PAT_TOKEN: ${{ secrets.TESWIZ_PAT }}

      - name: 🚀 Trigger Workflow in getting-started-with-teswiz (main only)
        if: github.ref_name == 'main'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.TESWIZ_REPO_DISPATCH_TOKEN }}
          repository: anandbagmar/getting-started-with-teswiz
          event-type: UpdateREADME
          client-payload: '{"teswiz_commit_id":"${{ env.COMMIT_ID }}"}'

      - name: 📦 Upload Unit Test Artifacts
        if: ${{ always() && github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]' && !startsWith(github.head_ref || github.ref_name, 'dependabot/') && !startsWith(github.head_ref || github.ref_name, 'renovate/') }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit
          path: target
          retention-days: 4

      - name: 🧹 Keep latest unit-test artifacts for this branch
        if: always()
        uses: ./.github/actions/cleanup-branch-artifacts
        with:
          workflow-file: Build_And_Run_Unit_Tests_CI.yml
          branch-name: ${{ github.head_ref || github.ref_name }}
          current-run-id: ${{ github.run_id }}
